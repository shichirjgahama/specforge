[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
version = "1.0.0"
description = "SpecForge: DSL, traceability, impact analysis and property based tests for a scooter sharing domain"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.100"]

[project.scripts]
specforge = "specforge.cli:main"

[tool.setuptools.packages.find]
include = ["specforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
